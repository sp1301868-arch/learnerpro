<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Glass Tic Tac Toe</title>
    <style>
        /* Unique Animated Gradient Background */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #1a2a6c, #b21f1f, #fdbb2d, #203a43, #0f2027);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }

        /* Mode Selection Buttons */
        .mode-selection {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            padding: 8px 15px;
            font-size: 1rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: rgba(255, 255, 255, 0.4);
            color: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            font-weight: bold;
            border-color: white;
        }

        .status {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            height: 30px; /* keeps layout stable when text changes */
        }

        /* Glassmorphism Board */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .cell {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* Hint Animation */
        .cell.hint-glow {
            animation: pulseHint 1s infinite alternate;
            background: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        @keyframes pulseHint {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        /* Bottom Controls */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button.action-btn {
            padding: 10px 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
        }

        button.action-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        button.action-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>Neon Glass Tic Tac Toe</h1>
    
    <div class="mode-selection">
        <button id="modePvP" class="mode-btn active">👥 2 Player</button>
        <button id="modePvC" class="mode-btn">🤖 vs Computer</button>
    </div>

    <div class="status" id="status">Player X's Turn</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
        <button id="hintBtn" class="action-btn">💡 Get a Hint</button>
        <button id="restartBtn" class="action-btn">🔄 Restart Game</button>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');
        const hintBtn = document.getElementById('hintBtn');
        const modePvPBtn = document.getElementById('modePvP');
        const modePvCBtn = document.getElementById('modePvC');
        
        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        let options = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let running = false;
        let gameMode = "pvp"; // "pvp" (Player vs Player) or "pvc" (Player vs Computer)
        let isComputerThinking = false;

        initializeGame();

        function initializeGame() {
            cells.forEach(cell => cell.addEventListener('click', cellClicked));
            restartBtn.addEventListener('click', restartGame);
            hintBtn.addEventListener('click', giveHint);
            
            // Mode Selectors
            modePvPBtn.addEventListener('click', () => setMode('pvp'));
            modePvCBtn.addEventListener('click', () => setMode('pvc'));

            statusText.textContent = `Player ${currentPlayer}'s Turn`;
            running = true;
        }

        function setMode(mode) {
            gameMode = mode;
            if (mode === 'pvp') {
                modePvPBtn.classList.add('active');
                modePvCBtn.classList.remove('active');
            } else {
                modePvCBtn.classList.add('active');
                modePvPBtn.classList.remove('active');
            }
            restartGame();
        }

        function cellClicked() {
            const cellIndex = this.getAttribute('data-index');

            // Prevent clicking if cell is full, game is over, or computer is taking its turn
            if (options[cellIndex] != "" || !running || isComputerThinking) {
                return;
            }

            clearHints();
            updateCell(this, cellIndex);
            checkWinner();
        }

        function updateCell(cell, index) {
            options[index] = currentPlayer;
            cell.textContent = currentPlayer;
            // Add some color coding for X and O
            cell.style.color = currentPlayer === "X" ? "#ff7675" : "#74b9ff";
        }

        function changePlayer() {
            currentPlayer = (currentPlayer == "X") ? "O" : "X";
            statusText.textContent = `Player ${currentPlayer}'s Turn`;
        }

        function checkWinner() {
            let roundWon = false;

            for (let i = 0; i < winConditions.length; i++) {
                const condition = winConditions[i];
                const cellA = options[condition[0]];
                const cellB = options[condition[1]];
                const cellC = options[condition[2]];

                if (cellA == "" || cellB == "" || cellC == "") {
                    continue;
                }
                if (cellA == cellB && cellB == cellC) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusText.textContent = `🎉 Player ${currentPlayer} Wins! 🎉`;
                running = false;
            } else if (!options.includes("")) {
                statusText.textContent = `It's a Draw! 🤝`;
                running = false;
            } else {
                changePlayer();
                
                // If it's vs Computer mode and it's O's turn, trigger the AI
                if (running && gameMode === "pvc" && currentPlayer === "O") {
                    isComputerThinking = true;
                    statusText.textContent = `Computer is thinking... 🤖`;
                    setTimeout(makeComputerMove, 600); // Small delay so it feels real
                }
            }
        }

        // --- COMPUTER AI LOGIC ---
        function makeComputerMove() {
            if (!running) return;

            let bestMove = findBestMove("O"); // Try to win or block
            
            // If no immediate win/block, pick center or random
            if (bestMove === -1) {
                if (options[4] === "") {
                    bestMove = 4; // Take center
                } else {
                    let emptySpots = options.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
                    bestMove = emptySpots[Math.floor(Math.random() * emptySpots.length)];
                }
            }

            const targetCell = document.querySelector(`.cell[data-index="${bestMove}"]`);
            updateCell(targetCell, bestMove);
            isComputerThinking = false;
            checkWinner();
        }

        function restartGame() {
            currentPlayer = "X";
            options = ["", "", "", "", "", "", "", "", ""];
            isComputerThinking = false;
            statusText.textContent = `Player ${currentPlayer}'s Turn`;
            cells.forEach(cell => {
                cell.textContent = "";
                cell.style.color = "white";
            });
            clearHints();
            running = true;
        }

        // --- HINT LOGIC ---
        function clearHints() {
            cells.forEach(cell => cell.classList.remove('hint-glow'));
        }

        function giveHint() {
            // Prevent hints if game is over or computer is thinking
            if (!running || isComputerThinking) return;
            clearHints();

            let bestMove = findBestMove(currentPlayer);
            
            if (bestMove === -1) {
                if (options[4] === "") {
                    bestMove = 4;
                } else {
                    let emptySpots = options.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
                    bestMove = emptySpots[Math.floor(Math.random() * emptySpots.length)];
                }
            }

            if (bestMove !== -1) {
                const targetCell = document.querySelector(`.cell[data-index="${bestMove}"]`);
                targetCell.classList.add('hint-glow');
                
                setTimeout(() => {
                    targetCell.classList.remove('hint-glow');
                }, 2000);
            }
        }

        // Reusable function to find a winning move or block the opponent
        function findBestMove(player) {
            const opponent = player === "X" ? "O" : "X";

            // 1. Check if we can win
            for (let i = 0; i < winConditions.length; i++) {
                let [a, b, c] = winConditions[i];
                if (options[a] == player && options[b] == player && options[c] == "") return c;
                if (options[a] == player && options[c] == player && options[b] == "") return b;
                if (options[b] == player && options[c] == player && options[a] == "") return a;
            }

            // 2. Check if we need to block the opponent
            for (let i = 0; i < winConditions.length; i++) {
                let [a, b, c] = winConditions[i];
                if (options[a] == opponent && options[b] == opponent && options[c] == "") return c;
                if (options[a] == opponent && options[c] == opponent && options[b] == "") return b;
                if (options[b] == opponent && options[c] == opponent && options[a] == "") return a;
            }

            return -1; // No obvious win/block
        }
    </script>
</body>
</html>
